id: "pod-failure"
title: "Pod Failure & Crash Loop Diagnostic Decision Tree"
trigger:
  symptom: "Pod non-functional, non-running, or restarting repeatedly"
  reason: "CrashLoopBackOff, OOMKilled, ImagePullBackOff, Pending, Evicted"

steps:
  - id: "step-1-inspect-status"
    action: "read"
    command: "kubectl get pod <pod-name> -n <namespace> -o json"
    purpose: "Inspect pod status phase and container statuses"
    outcomes:
      - condition: "status.containerStatuses[*].state.waiting.reason == 'CrashLoopBackOff'"
        next: "step-2-crashloop-logs"
      - condition: "status.containerStatuses[*].lastState.terminated.reason == 'OOMKilled'"
        next: "step-3-oomkilled-limits"
      - condition: "status.containerStatuses[*].state.waiting.reason == 'ImagePullBackOff' or 'ErrImagePull'"
        next: "step-4-imagepull-events"
      - condition: "status.phase == 'Pending'"
        next: "step-5-pending-scheduling"
      - condition: "status.reason == 'Evicted'"
        next: "step-6-evicted-node-conditions"

  - id: "step-2-crashloop-logs"
    action: "inspect"
    command: "kubectl logs <pod-name> -n <namespace> --previous --all-containers"
    purpose: "Fetch previous container log output prior to crash"
    outcomes:
      - condition: "Logs indicate exit code 1 or application exception"
        hypothesis: "Application error or missing environment variable"
        confidence: "High"
        next: "step-confirm-root-cause"

  - id: "step-3-oomkilled-limits"
    action: "inspect"
    command: "kubectl top pod <pod-name> -n <namespace> --containers"
    purpose: "Check memory limits vs actual consumption"
    outcomes:
      - condition: "Container memory reached configured limit"
        hypothesis: "Memory limit set too low or application memory leak"
        confidence: "High"
        next: "step-confirm-root-cause"

  - id: "step-4-imagepull-events"
    action: "inspect"
    command: "kubectl describe pod <pod-name> -n <namespace>"
    purpose: "Inspect image name, registry authentication, imagePullSecrets"
    outcomes:
      - condition: "Events show HTTP 401/403 or ImageNotFound"
        hypothesis: "Invalid image tag, missing registry credentials, or private registry access restriction"
        confidence: "High"
        next: "step-confirm-root-cause"

  - id: "step-5-pending-scheduling"
    action: "inspect"
    command: "kubectl describe pod <pod-name> -n <namespace>"
    purpose: "Check node scheduling constraints, PVC binding status, taints/tolerations"
    outcomes:
      - condition: "Events state '0/X nodes available: insufficient memory/cpu'"
        hypothesis: "Cluster resource exhaustion or node selector mismatch"
        confidence: "High"
        next: "step-confirm-root-cause"

  - id: "step-6-evicted-node-conditions"
    action: "inspect"
    command: "kubectl describe node <node-name>"
    purpose: "Check DiskPressure, MemoryPressure, PIDPressure on host node"
    outcomes:
      - condition: "Node HasDiskPressure == True"
        hypothesis: "Host node disk filled by container logs or ephemeral storage"
        confidence: "High"
        next: "step-confirm-root-cause"

  - id: "step-confirm-root-cause"
    action: "confirm"
    command: "kubectl get events -n <namespace> --field-selector involvedObject.name=<pod-name>"
    purpose: "Correlate container logs, termination reason, and events into confirmed diagnosis"
    next: "step-remediation-approval"

  - id: "step-remediation-approval"
    action: "remediate_approval_required"
    command: "Human approval required before applying remediation"
    purpose: "Present exact fix command and await human confirmation"
