# Dedicated identity for k8s-ai-troubleshooter. Bind a kubeconfig or a mounted
# token to this ServiceAccount rather than running the collector under a
# personal or cluster-admin identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-troubleshooter
  namespace: k8s-ai-troubleshooter
  labels:
    app.kubernetes.io/name: k8s-ai-troubleshooter
    app.kubernetes.io/component: rbac
