# Least-privilege ClusterRole for k8s-ai-troubleshooter — secrets excluded.
#
# Identical to clusterrole-readonly.yaml except it grants no access to Secret
# objects at all, in either direction. Use this when your team wants a
# stronger isolation boundary than "the collector doesn't display secret
# values" and is willing to accept the consequence below.
#
# CONSEQUENCE: this breaks Helm read operations. Helm's release storage
# backend is Secrets by default (type helm.sh/release.v1) — `helm list`,
# `helm status`, `helm get`, `helm history` all need to read them to answer
# anything at all. Bound to this role, every Helm command in
# runbooks/helm/*.md and the `helm-releases` step in scripts/collect.py will
# fail with Forbidden. The collector degrades gracefully — the failure is
# recorded in the bundle rather than crashing the run — but Helm diagnosis is
# simply unavailable under this role. There is no way to grant "list Secrets
# but only see Helm's" in core Kubernetes RBAC: `list` on the secrets
# resource is all-or-nothing per namespace, regardless of what any client
# chooses to display. See ../README.md#secrets-and-helm.
#
# The `secrets-metadata` step in scripts/collect.py will fail under this role
# too, for the same reason.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-troubleshooter-readonly-no-secrets
  labels:
    app.kubernetes.io/name: k8s-ai-troubleshooter
    app.kubernetes.io/component: rbac
rules:
  # --- Cluster-scoped: nodes, namespaces, cluster-wide storage -------------
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]

  # --- Namespaced: workloads -------------------------------------------------
  - apiGroups: [""]
    resources: ["pods", "events", "services", "endpoints",
                "persistentvolumeclaims", "configmaps",
                "resourcequotas", "limitranges", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  # --- Pod logs — a subresource, not the pods rule above ---------------------
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # --- No secrets rule. This is the entire point of this variant. -----------

  # --- Admission — read the webhook configs that can turn a bad deploy into
  #     a cluster-wide outage ---------------------------------------------
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list"]

  # --- Metrics — `kubectl top`. Inert without metrics-server installed -------
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  # --- Non-resource URLs: cluster-info, version, health endpoints -----------
  - nonResourceURLs: ["/healthz", "/healthz/*", "/livez", "/livez/*",
                      "/readyz", "/readyz/*", "/version", "/api", "/api/*",
                      "/apis", "/apis/*"]
    verbs: ["get"]
