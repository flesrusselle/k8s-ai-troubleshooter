name: CI & Runbook Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run Repository Structural Validation
        run: |
          python scripts/validate.py

      - name: Run Python Test Suite
        run: |
          python -m unittest discover tests

      - name: Generate PR Release Preview
        if: github.event_name == 'pull_request'
        run: |
          python scripts/generate_release_preview.py

  kind-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: k8s-ai-troubleshooter-ci
          wait: 120s

      - name: Run kind-based integration tests
        run: |
          python -m unittest discover -s tests/integration -p 'test_*.py' -v
